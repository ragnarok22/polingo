codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

flags:
  cli:
    paths:
      - packages/cli/src/
    carryforward: true
  core:
    paths:
      - packages/core/src/
    carryforward: true
  node:
    paths:
      - packages/node/src/
    carryforward: true
  react:
    paths:
      - packages/react/src/
    carryforward: true
  vue:
    paths:
      - packages/vue/src/
    carryforward: true
  web:
    paths:
      - packages/web/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
